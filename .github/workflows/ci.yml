name: Explorer CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: explorer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: apps/swaputer-web/package-lock.json
      - name: Install exact dependencies
        run: npm ci --prefix apps/swaputer-web
      - name: Audit production dependencies
        run: npm audit --prefix apps/swaputer-web --omit=dev --audit-level=high
      - name: Test, type-check, and build
        run: |
          npm test --prefix apps/swaputer-web
          npm run typecheck --prefix apps/swaputer-web
          npm run build --prefix apps/swaputer-web
      - name: Build production web image
        run: docker build --file apps/swaputer-web/Dockerfile --tag swaputer-explorer-web:verify .

  indexer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/svm-indexer/go.mod
          cache-dependency-path: services/svm-indexer/go.sum
      - name: Verify, test, and vet
        working-directory: services/svm-indexer
        run: |
          go mod download
          go mod verify
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build production indexer image
        run: docker build --file services/svm-indexer/Dockerfile --tag swaputer-svm-indexer:verify .
